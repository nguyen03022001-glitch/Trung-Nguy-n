<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Review your Lunara Pearl Co. pieces and send a considered order request."><title>Your bag | Lunara Pearl Co.</title><link rel="icon" href="images/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="cart"><div id="site-header"></div><main><section class="page-hero page-hero--compact container"><p class="eyebrow">Your selection</p><h1>A bag of<br><em>beautiful things.</em></h1></section><section class="cart-layout container"><div class="cart-list"><div class="cart-list__heading"><h2>Your bag</h2><button class="text-link" id="clear-cart">Clear bag</button></div><div id="cart-page-items"></div></div><aside class="order-card"><p class="eyebrow">Order request</p><h2>Make it <em>yours.</em></h2><p class="muted">Send us your details and we’ll confirm availability, delivery, and payment options personally.</p><div id="cart-summary"></div><form id="order-form" class="order-form"><label>Full name<input required name="name" type="text" autocomplete="name"></label><label>Phone number<input required name="phone" type="tel" autocomplete="tel"></label><label>Email<input required name="email" type="email" autocomplete="email"></label><label>Delivery address<textarea required name="address" rows="3" autocomplete="street-address"></textarea></label><label>Note <span class="optional">(optional)</span><textarea name="note" rows="2"></textarea></label><button class="button button--dark button--full" type="submit">Place order request <span aria-hidden="true">↗</span></button><p class="form-message" id="order-message" role="status"></p></form></aside></section></main><div id="site-footer"></div><div id="global-overlays"></div><script src="js/products.js"></script><script src="js/main.js"></script></body></html>
