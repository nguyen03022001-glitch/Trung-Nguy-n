<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Xem lại sản phẩm đã chọn và gửi yêu cầu đặt hàng đến Tâm Ý Jewelry."><title>Giỏ hàng | Tâm Ý Jewelry</title><link rel="icon" href="images/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="cart"><div id="site-header"></div><main><section class="page-hero page-hero--compact container"><p class="eyebrow">Lựa chọn của bạn</p><h1>Một giỏ hàng<br><em>đầy điều xinh đẹp.</em></h1></section><section class="cart-layout container"><div class="cart-list"><div class="cart-list__heading"><h2>Giỏ hàng</h2><button class="text-link" id="clear-cart">Xóa giỏ hàng</button></div><div id="cart-page-items"></div></div><aside class="order-card"><p class="eyebrow">Yêu cầu đặt hàng</p><h2>Hãy để nó <em>thuộc về bạn.</em></h2><p class="muted">Gửi thông tin để chúng tôi xác nhận tình trạng, giao hàng và phương thức thanh toán phù hợp.</p><div id="cart-summary"></div><form id="order-form" class="order-form"><label>Họ và tên<input required name="name" type="text" autocomplete="name"></label><label>Số điện thoại<input required name="phone" type="tel" autocomplete="tel"></label><label>Email<input required name="email" type="email" autocomplete="email"></label><label>Địa chỉ nhận hàng<textarea required name="address" rows="3" autocomplete="street-address"></textarea></label><label>Ghi chú <span class="optional">(không bắt buộc)</span><textarea name="note" rows="2"></textarea></label><button class="button button--dark button--full" type="submit">Gửi yêu cầu đặt hàng <span aria-hidden="true">↗</span></button><p class="form-message" id="order-message" role="status"></p></form></aside></section></main><div id="site-footer"></div><div id="global-overlays"></div><script src="js/products.js"></script><script src="js/main.js"></script></body></html>
